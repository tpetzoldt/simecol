name: R-full-check

on:
  # Trigger the workflow manually from the Actions tab
  workflow_dispatch: {}
  # Keep push and pull_request triggers if you still want them,
  # otherwise remove the lines below
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #os: [ubuntu-latest, windows-latest, macos-latest]
        os: [ubuntu-latest, macos-latest]
        #r-version: [release, devel]
        r-version: [release]

    steps:
      - uses: actions/checkout@v4
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true
      - name: Set up LaTeX
        uses: r-lib/actions/setup-tinytex@v2
      - name: Install system dependencies (gs, qpdf) on Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          # sudo apt-get install -y ghostscript qpdf
          sudo apt-get install -y tidy
      - name: Install system dependencies (gs, qpdf) on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        # Using Chocolatey
        run: |
          # choco install ghostscript qpdf --no-progress --limit-output || true # Use || true to prevent failure if choco is already installed or fails softly
          choco install tidy --no-progress --limit-output || true
      - name: Install system dependencies (gs, qpdf) on macOS
        if: ${{ matrix.os == 'macos-latest' }}
        # Using Homebrew
        run: |
          brew update
          # brew install ghostscript qpdf # seems to be already available
          brew install tidy-html5
          
      - name: Install dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "V8"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      - name: Check
        env:
        # Set the environment variables for vignette compaction
          _R_BUILD_COMPACT_VIGNETTES_: both
          _R_CHECK_COMPACT_VIGNETTES_: both
        # run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-build-vignettes"), error_on = "error")
        # run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        run: rcmdcheck::rcmdcheck(args = "--as-cran", error_on = "error")
        shell: Rscript {0}
